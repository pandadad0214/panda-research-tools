[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "panda-research-tools"
version = "0.1.0"
description = "Panda Research Tools: scholarly integrity and papers: citation checks, literature and PubMed search, academic experts, PDF tables, Wayback Machine snapshots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Panda Federation (pandadad0214)" }]
keywords = ["mcp", "mcp-server", "apify", "panda-federation", "research"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "panda-federation-tools>=1.7.0,<2",
]

[project.urls]
Homepage = "https://github.com/pandadad0214/panda-research-tools"
Source = "https://github.com/pandadad0214/panda-research-tools"
"Umbrella index" = "https://github.com/pandadad0214/panda-federation-tools"
"Apify Store" = "https://apify.com/pandadad0214"

[project.scripts]
panda-research-tools = "panda_research_tools.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_research_tools"]

[dependency-groups]
dev = [
  "ruff==0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"**/test_*.py" = ["S101", "S105", "S106"]
